[package]
name = "stm4"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
cortex-m = { version = "0.7.4", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.1"
panic-probe = "1.0.0"
defmt = "1"
defmt-rtt = "1.1.0"

ssd1331 = "0.3.0"
ssd1306 = { version = "0.10.0" }
embedded-graphics = { version = "0.8.2", features = ["defmt"] }
display-interface = { version = "0.5.0", features = ["defmt-03"] }

[dependencies.stm32f4xx-hal]
version = "0.23.0"
features = ["stm32f407", "defmt"]

[profile.release]
debug = 2